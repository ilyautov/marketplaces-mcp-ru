[project]
name = "marketplaces-mcp-ru"
version = "0.5.0"
description = "MCP servers for Wildberries, Ozon, Yandex Market and Avito seller APIs (schema-driven, safety-gated)"
keywords = ["mcp", "model-context-protocol", "wildberries", "ozon", "yandex-market", "avito", "seller-api", "marketplace", "ecommerce", "russia", "claude", "cursor", "codex"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Upper bounds on purpose: mcp 2.x renamed FastMCP (mcp.server.fastmcp is
    # gone) and would break every fresh `uvx` / pip install; httpx 1.x and
    # pyyaml 7 are held the same way. serve.py pins the identical set.
    "mcp>=1.2,<2",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
]

[project.scripts]
marketplaces-mcp-ru = "core.combined:main"
wb-mcp = "wb_mcp.server:main"
ozon-mcp = "ozon_mcp.server:main"
ozon-perf-mcp = "ozon_perf_mcp.server:main"
yandex-mcp = "yandex_mcp.server:main"
avito-mcp = "avito_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.5",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "wb_mcp", "ozon_mcp", "ozon_perf_mcp", "yandex_mcp", "avito_mcp"]

[tool.setuptools.package-data]
core = ["entities.yaml"]
wb_mcp = ["endpoints.yaml", "workflows.yaml"]
# perf_endpoints.yaml lives in ozon_mcp because ozon_perf_mcp/server.py loads
# it from ../ozon_mcp/perf_endpoints.yaml — it MUST ship inside ozon_mcp.
ozon_mcp = ["endpoints.yaml", "perf_endpoints.yaml", "workflows.yaml"]
ozon_perf_mcp = ["workflows.yaml"]
yandex_mcp = ["endpoints.yaml", "workflows.yaml"]
avito_mcp = ["endpoints.yaml", "workflows.yaml"]
