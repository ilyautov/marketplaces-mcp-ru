name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # One Windows leg (single Python) to catch platform-specific breakage
          # without blowing up the matrix.
          - os: windows-latest
            python-version: "3.12"
          # One macOS leg: the .command installer and Claude Desktop paths are
          # macOS-first for most sellers.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest "pyyaml>=6.0,<7" "httpx>=0.27,<1" "mcp>=1.2,<2"
      - name: Run tests (offline, no tokens)
        # -u clears any inherited creds so tests run in a clean env.
        # Includes the safety-catalog lint: fails if any PUT/PATCH/DELETE is
        # marked safety:read (which would bypass the write gate in call_method).
        shell: bash
        run: env -u OZON_CLIENT_ID -u OZON_API_KEY -u WB_API_TOKEN python -m pytest tests/ -q
      - name: Selfcheck all three servers
        shell: bash
        run: |
          python serve.py wb --selfcheck
          python serve.py ozon --selfcheck
          python serve.py ozon-perf --selfcheck

  docker:
    # The image is what the MCP Registry advertises; a Dockerfile that stops
    # building must fail here, not on the release tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t marketplaces-mcp-ru:ci .
      - name: Combined server mounts every tool inside the container
        run: |
          docker run --rm --entrypoint python marketplaces-mcp-ru:ci -c \
            'import asyncio; from core.combined import build; n=len(asyncio.run(build().list_tools())); assert n>=50, n; print("tools:", n)'
      - name: "doctor lists every service (exit 1 without keys, by design)"
        shell: bash
        run: |
          set +e; OUT=$(docker run --rm marketplaces-mcp-ru:ci doctor); RC=$?; set -e
          echo "$OUT"; [ "$RC" = "1" ]; echo "$OUT" | grep -q "Ozon Performance"
